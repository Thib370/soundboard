<!doctype html><html><head><meta charset="utf-8"><title>Soundboard Mic</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css"></head><body><main>
<h1>Soundboard Mic</h1>
<section class="row">
 <label><input type="checkbox" id="send"> Send to mic</label>
 <label><input type="checkbox" id="mon" checked> Hear in headphones</label>
 <label><input type="checkbox" id="mix"> Mix my real mic</label>
 <label title="Play your own microphone in your headphones. Use headphones, not speakers, or it will feed back."><input type="checkbox" id="hear"> Hear my mic (headphones)</label>
 <label>Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
 <button id="stop">Stop all (Ctrl+Alt+0)</button>
</section>
<section class="row">
 <label>Virtual mic output <select id="micOut"></select></label>
 <label>Headphones <select id="monOut"></select></label>
 <label>Real mic <select id="micIn"></select></label>
</section>
<section id="flow">
 <div class="col"><h3>Sources</h3>
  <div class="node" id="nSounds"><b>Sounds</b><span id="playing">idle</span></div>
  <div class="node" id="nIn"><b>Real mic</b><span id="inName">off</span><i class="bar"><u id="mIn"></u></i></div></div>
 <div class="arr" id="a1">➜</div>
 <div class="col"><h3>Soundboard</h3><div class="node" id="nApp"><b>Mixer</b><span>volume <em id="volTxt"></em></span></div></div>
 <div class="arr" id="a2">➜</div>
 <div class="col"><h3>Outputs</h3>
  <div class="node" id="nMic"><b>Virtual mic → Discord/Teams</b><span id="micName"></span><span id="discName" class="need"></span><i class="bar"><u id="mMic"></u></i></div>
  <div class="node" id="nMon"><b>Headphones</b><span id="monName"></span><i class="bar"><u id="mMon"></u></i></div></div>
</section>
<p id="warn" class="warn" hidden>No virtual cable found (e.g. "CABLE Input"). Install VB-Cable, then restart. See README.</p>
<section class="row">
 <button id="add">+ Add files</button>
 <input id="url" placeholder="YouTube / web URL" size="40"><button id="imp">Import</button>
 <button id="upd">Update yt-dlp</button>
 <input id="recName" placeholder="Recording name (optional)" size="22"><button id="rec">● Record</button>
</section>
<p id="msg" class="msg"></p>
<section class="row" id="tabs"></section>
<section class="row">
 <input id="folderName" placeholder="Folder name" size="18"><button id="fAdd">+ Folder</button><button id="fRen">Rename folder</button><button id="fDel">Delete folder</button>
 <button id="view">List view</button>
</section>
<div id="grid"></div>
<p class="hint">Hotkeys: Ctrl+Alt+1..9 play the first 9 sounds.</p>
</main><script type="module" src="renderer.js"></script></body></html>
